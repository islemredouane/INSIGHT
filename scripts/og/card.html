<!doctype html>
<!-- INSIGHT Open Graph & Twitter Social Card (1200x630)
     Inspired by Rasa Website, tailored for INSIGHT Research Club.
     Query parameters: title, eyebrow, line, stat, statLabel, img (path relative to repo root), fit=cover|contain -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&family=Lora:ital,wght@1,500&display=block">
<style>
  :root {
    --ink: #0B1120;
    --ink-2: #121A2E;
    --navy: #1B2A55;
    --blue: #3F66B0;
    --peri: #7F97C7;
    --peri-light: #AEC6FF;
    --silver: #DDE3EC;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; background: var(--ink); overflow: hidden; }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--ink);
    font-family: 'Inter', sans-serif;
    color: var(--white);
  }

  /* Deep Nautical Glows & Beam */
  .glow { position: absolute; border-radius: 50%; filter: blur(100px); pointer-events: none; }
  .glow.a { width: 700px; height: 700px; left: -220px; top: -260px; background: rgba(63, 102, 176, .35); }
  .glow.b { width: 500px; height: 500px; right: 100px; top: -150px; background: rgba(127, 151, 199, .18); }
  .glow.c { width: 600px; height: 600px; right: -180px; bottom: -200px; background: rgba(27, 42, 85, .50); }

  /* Dot Matrix Grid */
  .grid {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(221, 227, 236, .14) 1.2px, transparent 1.2px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(ellipse at 40% 50%, #000 15%, transparent 75%);
    mask-image: radial-gradient(ellipse at 40% 50%, #000 15%, transparent 75%);
  }

  /* Lighthouse Ray Beam */
  .beam {
    position: absolute;
    top: -100px;
    left: 40px;
    width: 900px;
    height: 800px;
    background: conic-gradient(from 120deg at 0% 10%, rgba(174, 198, 255, .15) 0deg, rgba(63, 102, 176, .05) 35deg, transparent 65deg);
    pointer-events: none;
  }

  .left {
    position: absolute;
    left: 72px;
    top: 60px;
    bottom: 60px;
    width: 660px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 2;
  }

  .brand-wrap {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .brand-logo {
    width: 58px;
    height: auto;
    filter: drop-shadow(0 0 16px rgba(127, 151, 199, .55));
  }
  .brand-text {
    display: flex;
    flex-direction: column;
    line-height: 1;
  }
  .brand-name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--white);
  }
  .brand-sub {
    margin-top: 5px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--peri);
  }

  .content-mid {
    margin-top: auto;
    margin-bottom: auto;
    padding-top: 20px;
    padding-bottom: 20px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 7px 16px;
    background: rgba(63, 102, 176, .18);
    border: 1px solid rgba(127, 151, 199, .35);
    color: var(--peri-light);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .eyebrow-dot {
    width: 6px;
    height: 6px;
    background: var(--peri-light);
    box-shadow: 0 0 0 3px rgba(127, 151, 199, .3);
  }

  h1 {
    margin-top: 20px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 70px;
    line-height: 1.04;
    letter-spacing: -1.5px;
    color: var(--white);
    max-width: 650px;
  }
  h1 .gradient {
    background: linear-gradient(135deg, #FFFFFF 15%, #AEC6FF 50%, #7F97C7 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .line {
    margin-top: 20px;
    font-family: 'Inter', sans-serif;
    font-size: 21px;
    font-weight: 400;
    line-height: 1.45;
    color: rgba(221, 227, 236, .85);
    max-width: 620px;
  }

  .foot {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 600;
    color: var(--peri);
    letter-spacing: 0.5px;
  }
  .foot-bar {
    width: 48px;
    height: 3px;
    background: var(--blue);
  }
  .foot-sub {
    color: rgba(221, 227, 236, .5);
    font-weight: 400;
  }

  /* Right Side Visual Area */
  .right {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 500px;
    z-index: 1;
    overflow: hidden;
  }
  .right .ph {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 35%);
    mask-image: linear-gradient(to right, transparent 0%, #000 35%);
    filter: brightness(.92) contrast(1.05);
  }
  .right .ph.contain {
    background-size: 88%;
    background-repeat: no-repeat;
    background-position: center right 40px;
    mix-blend-mode: screen;
    -webkit-mask-image: radial-gradient(circle at 65% 50%, #000 50%, transparent 75%);
    mask-image: radial-gradient(circle at 65% 50%, #000 50%, transparent 75%);
  }
  .right .tint {
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, var(--ink) 0%, rgba(11, 17, 32, .2) 45%, transparent 100%),
                linear-gradient(to top, rgba(11, 17, 32, .8) 0%, transparent 50%);
  }

  /* Fallback Compass Graphic when no image is provided */
  .compass-graphic {
    position: absolute;
    right: -40px;
    top: 50%;
    transform: translateY(-50%);
    width: 440px;
    height: 440px;
    opacity: 0.35;
    pointer-events: none;
  }

  /* Stat Floating Pill */
  .stat-badge {
    position: absolute;
    right: 64px;
    bottom: 60px;
    z-index: 3;
    padding: 18px 24px;
    background: rgba(18, 26, 46, .85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(127, 151, 199, .3);
    box-shadow: 0 20px 40px rgba(0, 0, 0, .5);
    display: flex;
    flex-direction: column;
  }
  .stat-num {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 46px;
    font-weight: 700;
    line-height: 1;
    color: var(--peri-light);
  }
  .stat-label {
    margin-top: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--silver);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="glow a"></div>
    <div class="glow b"></div>
    <div class="glow c"></div>
    <div class="beam"></div>
    <div class="grid"></div>

    <div class="right" id="right">
      <div class="ph" id="ph"></div>
      <div class="tint"></div>
      <!-- Decorative Compass SVG shown when no image -->
      <svg id="compass" class="compass-graphic" viewBox="0 0 200 200" fill="none" stroke="currentColor">
        <circle cx="100" cy="100" r="90" stroke="#7F97C7" stroke-width="1.5" stroke-dasharray="4 4" />
        <circle cx="100" cy="100" r="70" stroke="#3F66B0" stroke-width="1.5" />
        <circle cx="100" cy="100" r="50" stroke="#7F97C7" stroke-width="1" stroke-dasharray="2 4" />
        <path d="M100 0 L100 200 M0 100 L200 100" stroke="#7F97C7" stroke-width="1.2" />
        <polygon points="100,25 110,90 100,80 90,90" fill="#AEC6FF" />
        <polygon points="100,175 110,110 100,120 90,110" fill="#3F66B0" />
      </svg>
    </div>

    <div class="left">
      <div class="brand-wrap">
        <img class="brand-logo" src="../../public/brand/insight-logo.png" alt="INSIGHT">
        <div class="brand-text">
          <span class="brand-name">INSIGHT</span>
          <span class="brand-sub">ESTIN Research Club · Béjaïa</span>
        </div>
      </div>

      <div class="content-mid">
        <div class="eyebrow" id="eyebrow-wrap">
          <span class="eyebrow-dot"></span>
          <span id="eyebrow"></span>
        </div>
        <h1 id="title"></h1>
        <p class="line" id="line"></p>
      </div>

      <div class="foot">
        <span class="foot-bar"></span>
        <span>insight.estin.dz</span>
        <span class="foot-sub">· Season 2026/27</span>
      </div>
    </div>
  </div>

<script>
  const q = new URLSearchParams(location.search);
  const rawTitle = q.get("title") || "INSIGHT Research Club";
  const words = rawTitle.split(" ");
  
  // Format title with gradient accent on the first 1-2 words
  if (words.length <= 2) {
    document.getElementById("title").innerHTML = `<span class="gradient">${rawTitle}</span>`;
  } else {
    document.getElementById("title").innerHTML = `<span class="gradient">${words.slice(0, 2).join(" ")}</span><br>${words.slice(2).join(" ")}`;
  }

  document.getElementById("eyebrow").textContent = q.get("eyebrow") || "ESTIN Béjaïa";
  document.getElementById("line").textContent = q.get("line") || "";

  const img = q.get("img");
  const ph = document.getElementById("ph");
  const compass = document.getElementById("compass");

  if (img) {
    ph.style.backgroundImage = `url("../../${img}")`;
    if (q.get("fit") === "contain") ph.classList.add("contain");
    if (compass) compass.style.display = "none";
  } else {
    ph.style.display = "none";
    if (compass) compass.style.display = "block";
  }

  if (q.get("stat")) {
    const s = document.createElement("div");
    s.className = "stat-badge";
    s.innerHTML = `<span class="stat-num"></span><span class="stat-label"></span>`;
    s.querySelector(".stat-num").textContent = q.get("stat");
    s.querySelector(".stat-label").textContent = q.get("statLabel") || "";
    document.querySelector(".card").append(s);
  }
</script>
</body>
</html>
